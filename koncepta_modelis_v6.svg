xt x="450.0" y="372" text-anchor="middle" font-weight="bold" font-size="14">Grāmata</text><line x1="345" y1="382" x2="555" y2="382" stroke="#222"/><text x="353" y="400" font-size="12">nosaukums</text><text x="353" y="417" font-size="12">peļņa par vienību</text><rect x="660" y="350" width="210" height="55" fill="#eef3fb" stroke="#222" stroke-width="1.5"/><text x="765.0" y="372" text-anchor="middle" font-weight="bold" font-size="14">Pasūtījums</text><line x1="660" y1="382" x2="870" y2="382" stroke="#222"/><text x="668" y="400" font-size="12">minimālais drukājamo gr. skaits</text><rect x="30" y="350" width="210" height="62" fill="#fdf3e3" stroke="#222" stroke-width="1.5" stroke-dasharray="6 3"/><text x="135.0" y="372" text-anchor="middle" font-weight="bold" font-size="14">Laiks uz vienību</text><line x1="30" y1="382" x2="240" y2="382" stroke="#222"/><text x="38" y="400" font-size="12">nepieciešamais darbības laiks</text><polyline points="135,100 135,190" fill="none" stroke="#222" stroke-width="1.3"/><text x="145" y="115" text-anchor="start" font-size="13" >1</text><text x="145" y="185" text-anchor="start" font-size="13" >*</text><text x="150" y="150" text-anchor="start" font-size="11" fill="#555">ir noslogota</text><polyline points="345,95 290,95 290,225 240,225" fill="none" stroke="#222" stroke-width="1.3"/><text x="335" y="90" text-anchor="end" font-size="13" >1</text><text x="250" y="218" text-anchor="start" font-size="13" >*</text><text x="284" y="160" text-anchor="end" font-size="11" fill="#555">aptver</text><polyline points="450,100 450,190" fill="none" stroke="#222" stroke-width="1.3"/><text x="460" y="115" text-anchor="start" font-size="13" >1</text><text x="460" y="185" text-anchor="start" font-size="13" >*</text><text x="460" y="150" text-anchor="start" font-size="11" fill="#555">satur</text><polyline points="555,55 660,55" fill="none" stroke="#222" stroke-width="1.3"/><text x="565" y="48" text-anchor="start" font-size="13" >*</text><text x="650" y="48" text-anchor="end" font-size="13" >1</text><text x="607" y="72" text-anchor="middle" font-size="11" fill="#555">izveido</text><polyline points="555,385 660,385" fill="none" stroke="#222" stroke-width="1.3"/><text x="565" y="378" text-anchor="start" font-size="13" >1</text><text x="650" y="378" text-anchor="end" font-size="13" >*</text><text x="607" y="402" text-anchor="middle" font-size="11" fill="#555">pasūtīta</text><polyline points="345,375 240,375" fill="none" stroke="#222" stroke-width="1.3"/><text x="335" y="368" text-anchor="end" font-size="13" >1</text><text x="250" y="368" text-anchor="start" font-size="13" >*</text><text x="292" y="392" text-anchor="middle" font-size="11" fill="#555">prasa</text><polyline points="30,60 10,60 10,385 30,385" fill="none" stroke="#222" stroke-width="1.3"/><text x="24" y="52" text-anchor="end" font-size="13" >1</text><text x="24" y="378" text-anchor="end" font-size="13" >*</text><text x="450" y="450" text-anchor="middle" font-size="11" fill="#555">Raksturojuma klases (raustītā līnija) – saites ar atribūtiem; * = daudz, 1 = viens, / = atvasināts atribūts</text><text x="450" y="472" text-anchor="middle" font-size="11" fill="#555">Iekārta: druka, griešana, šūšana, apdare – katra grāmata iet cauri visām (viens ieraksts «Laiks uz vienību» katram pārim grāmata–iekārta)</text><polyline points="555,221 765,221 765,350" fill="none" stroke="#222" stroke-width="1.3"/><text x="565" y="214" font-size="13">*</text><text x="775" y="343" font-size="13">1</text><text x="660" y="214" text-anchor="middle" font-size="11" fill="#555">attiecas uz</text><text x="450" y="494" text-anchor="middle" font-size="11" fill="#555">Grāmata plānā tiek noteikta caur pasūtījumu; minimālais skaits ir katram pasūtījumam atsevišķi</text></svg>